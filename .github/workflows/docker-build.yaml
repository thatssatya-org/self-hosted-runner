name: Build and Publish image to Docker Hub

on:
  push:
    branches:
      - master

jobs:
  publish-runner-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Build linux/arm64 Docker Image
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 -t thatssatyadocker/github-runner:latest .
      - name: Push to Docker Hub
        run: |
          docker login -u thatssatyadocker -p ${{ secrets.DOCKER_HUB_SECRET }}
          docker push thatssatyadocker/github-runner:latest